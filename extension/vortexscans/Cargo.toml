[package]
name = "vortexscans"
version = "1.0.0"
edition = "2021"
authors = ["wzread"]
description = "Vortex Scans extension - Read Comics, manga, manhua, manhwa"

[[bin]]
name = "vortexscans"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
urlencoding = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"