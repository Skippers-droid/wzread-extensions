[package]
name = "roliascan"
version = "1.0.0"
edition = "2021"
authors = ["wzread"]
description = "Roliascan extension - Read comics from Roliascan"

[[bin]]
name = "roliascan"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
urlencoding = "2.0"
jsonrpc-core = "18.0"
jsonrpc-http-server = "18.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"