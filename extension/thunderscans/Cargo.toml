[package]
name = "thunderscans"
version = "1.0.0"
edition = "2024"
authors = ["wzread"]
description = "ThunderScans EN extension - Read comics from ThunderScans"

[[bin]]
name = "thunderscans"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
urlencoding = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"